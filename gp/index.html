```html
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bốn Anh Em Siêu Nhân</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');

/* =========================================================
   RESET
   ========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* =========================================================
   BODY
   ========================================================= */

body {
    min-height: 100vh;
    background: #111;
    color: #fff;
    font-family: 'Inter', sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow-x: hidden;
    overflow-y: auto;

    transition:
        background .35s ease,
        color .35s ease;
}

/* =========================================================
   MAIN CONTAINER
   ========================================================= */

.container {
    width: 90%;
    max-width: 1200px;
    text-align: center;
    padding: 40px 20px;
    position: relative;
}

/* =========================================================
   DARK / LIGHT TOGGLE
   ========================================================= */

.theme-toggle {
    width: 52px;
    height: 52px;
    flex: 0 0 auto;

    border: 1px solid rgba(255,255,255,.10);
    border-radius: 50%;

    background: #0d0d0d;
    color: #fff;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    position: absolute;
    top: 20px;
    right: 0;

    transition:
        background .3s ease,
        border .3s ease,
        transform .2s ease;
}

.theme-toggle:hover {
    transform: scale(1.06);
}

.toggle-icon {
    position: absolute;
    font-size: 21px;
    line-height: 1;

    transition:
        opacity .25s ease,
        transform .25s ease;
}

/* Dark mode */

.theme-toggle .moon {
    opacity: 1;
    transform: rotate(0) scale(1);
}

.theme-toggle .sun {
    opacity: 0;
    transform: rotate(-45deg) scale(.5);
}

/* =========================================================
   SMALL TITLE
   ========================================================= */

.small-title {
    color: #888;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 32px;

    transition: color .35s ease;
}

/* =========================================================
   GROUP NAME
   ========================================================= */

.group-name {
    font-size: clamp(44px, 9vw, 110px);
    line-height: 1.08;
    font-weight: 900;
    letter-spacing: -2px;
    padding: 0.15em 0;

    background: linear-gradient(
        90deg,
        #ff0055,
        #ff8a00,
        #ffe600,
        #00ff88,
        #00c8ff,
        #6c00ff,
        #ff00cc,
        #ff0055
    );

    background-size: 400% 100%;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;

    animation: rgb 8s linear infinite;
}

@keyframes rgb {
    from {
        background-position: 0% 50%;
    }

    to {
        background-position: 400% 50%;
    }
}

/* =========================================================
   LINE
   ========================================================= */

.line {
    width: 70px;
    height: 2px;
    margin: 30px auto 0;
    background: #555;

    transition: background .35s ease;
}

/* =========================================================
   TEAM MEMBERS
   ========================================================= */

.members {
    width: 100%;
    max-width: 460px;
    margin: 28px auto 0;
    text-align: left;
}

.members-title {
    margin-bottom: 12px;
    color: #888;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2.5px;
    text-align: center;

    transition: color .35s ease;
}

.members-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
}

.member {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;

    padding: 13px 12px;

    border: 1px solid rgba(255,255,255,.09);
    border-radius: 12px;
    background: rgba(255,255,255,.035);

    transition:
        border-color .25s ease,
        background .25s ease,
        transform .25s ease;
}

.member:hover {
    border-color: rgba(0,200,255,.45);
    background: rgba(0,200,255,.07);
    transform: translateY(-2px);
}

.member-number {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 900;
    color: #00c8ff;
}

.member-name {
    min-width: 0;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

/* =========================================================
   LIGHT MODE
   ========================================================= */

body.light {
    background: #f5f5f5;
    color: #080808;
}

/* Toggle */

body.light .theme-toggle {
    background: #fff;
    color: #080808;
    border-color: rgba(0,0,0,.10);
}

body.light .theme-toggle .moon {
    opacity: 0;
    transform: rotate(45deg) scale(.5);
}

body.light .theme-toggle .sun {
    opacity: 1;
    transform: rotate(0) scale(1);
}

/* Text */

body.light .small-title,
body.light .members-title {
    color: #777;
}

/* Line */

body.light .line {
    background: #aaa;
}

/* Member cards */

body.light .member {
    border-color: rgba(0,0,0,.09);
    background: rgba(0,0,0,.025);
}

body.light .member:hover {
    border-color: rgba(0,150,220,.45);
    background: rgba(0,150,220,.06);
}

body.light .member-number {
    color: #008dcc;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .container {
        width: 100%;
        padding: 80px 15px 30px;
    }

    .theme-toggle {
        width: 45px;
        height: 45px;
        top: 15px;
        right: 15px;
    }

    .toggle-icon {
        font-size: 19px;
    }

    .small-title {
        font-size: 11px;
        letter-spacing: 1px;
        margin-bottom: 25px;
    }

    .group-name {
        font-size: clamp(38px, 11vw, 70px);
        line-height: 1.08;
        letter-spacing: -1px;
    }

    .line {
        margin-top: 25px;
    }

    .members {
        margin-top: 22px;
    }

    .members-list {
        gap: 8px;
    }

    .member {
        gap: 7px;
        padding: 11px 9px;
        border-radius: 10px;
    }

    .member-name {
        font-size: 11px;
    }

    .member-number {
        font-size: 10px;
    }
}

/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width: 360px) {
    .members-list {
        grid-template-columns: 1fr;
    }

    .member {
        padding: 12px;
    }

    .member-name {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<main class="container">

    <!-- Dark / Light Toggle -->

    <button
        class="theme-toggle"
        id="themeToggle"
        aria-label="Đổi giao diện"
        aria-pressed="false"
        type="button"
    >
        <span class="toggle-icon moon">☾</span>
        <span class="toggle-icon sun">☀</span>
    </button>

    <!-- Class Information -->

    <div class="small-title">
        11A1 · Bài tập 2.2
    </div>

    <!-- Group Name -->

    <h1 class="group-name">
        BỐN ANH EM<br>
        SIÊU NHÂN
    </h1>

    <div class="line"></div>

    <!-- Team Members -->

    <section class="members" aria-label="Danh sách thành viên">

        <div class="members-title">
            THE TEAM · 11A1
        </div>

        <div class="members-list">

            <div class="member">
                <span class="member-number">01</span>
                <span class="member-name">
                    Lê Phước Nhật Minh
                </span>
            </div>

            <div class="member">
                <span class="member-number">02</span>
                <span class="member-name">
                    Đồng Minh Vũ
                </span>
            </div>

            <div class="member">
                <span class="member-number">03</span>
                <span class="member-name">
                    Dương Phúc Nguyễn
                </span>
            </div>

            <div class="member">
                <span class="member-number">04</span>
                <span class="member-name">
                    Vũ Hoàng Tùng Lâm
                </span>
            </div>

        </div>
    </section>

</main>

<script>
/* =========================================================
   DARK / LIGHT MODE
   ========================================================= */

const themeToggle = document.getElementById("themeToggle");

function setTheme(theme) {
    const isLight = theme === "light";

    document.body.classList.toggle("light", isLight);

    themeToggle.setAttribute(
        "aria-pressed",
        String(isLight)
    );

    try {
        localStorage.setItem("team-theme", theme);
    } catch (error) {
        // Theme vẫn hoạt động nếu trình duyệt chặn localStorage.
    }
}

themeToggle.addEventListener("click", () => {
    const isLight = document.body.classList.contains("light");

    setTheme(isLight ? "dark" : "light");
});

/* =========================================================
   REMEMBER USER'S CHOICE
   ========================================================= */

try {
    const savedTheme = localStorage.getItem("team-theme");

    if (savedTheme === "light" || savedTheme === "dark") {
        setTheme(savedTheme);
    }
} catch (error) {
    // Sử dụng dark mode mặc định.
}
</script>

</body>
</html>
